<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            document.addEventListener("DOMContentLoaded", function(){
                let correctButton= document.querySelector(".correct");
                let wrongButton= document.querySelectorAll(".incorrect");
                let mcqResult= document.getElementById("mcq_result");

                correctButton.addEventListener("click", function(){
                    correctButton.style.backgroundColor = "green";
                    mcqResult.innerHTML = "Correct!";
                })
                for (let i=0; i<wrongButton.length; i++){
                wrongButton[i].addEventListener("click", function(){
                    wrongButton[i].style.backgroundColor = "red";
                    mcqResult.innerHTML = "Incorrect";
                })
                }

                let check=document.getElementById("submit");
                check.addEventListener("click", function(){
                    let input = document.getElementById("answer");
                    let freeResponse = document.getElementById("freeResponse");

                    if (input.value === "Paris"){
                        input.style.backgroundColor="green";
                        freeResponse.innerHTML="Correct!";
                    }else {
                        input.style.backgroundColor="red";
                        freeResponse.innerHTML="Incorrect";
                    }
                })
            })
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>

                <h3>Which planet is known as the red planet?</h3>

                <button class="incorrect">Earth</button>
                <button class="correct">Mars</button>
                <button class="incorrect">Venus</button>

                <p id="mcq_result"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>

                <h3>Which city is known as the fashion capital of the world?</h3>

                <input type="text" id="answer">
                <button id="submit">Submit</button>

                <p id="freeResponse"></p>
            </div>
        </div>
    </body>
</html>
