<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">
        <title>Hobbies</title>
    </head>
    <body>

        <div class="container-fluid mt-4">

            <h2 class="heading mb-4">Hobbies</h2>

            <div class="row text-center">

            <div class="col-md-3">
                Watching Test Cricket
            </div>

            <div class="col-md-3">
                Gym
            </div>

            <div class="col-md-3">
                Binge Watching
            </div>

            <div class="col-md-3">
                Cooking
            </div>
        </div>

        <div class="row text-center mt-3">

            <div class="col-md-3">
                <img src="images/cricket.jpg" alt="cricket" class="top-image">
            </div>

            <div class="col-md-3">
                <img src="images/gym.jpg" alt="gym" class="top-image">
            </div>

            <div class="col-md-3">
                <img src="images/netflix.png" alt="binge watching" class="top-image">
            </div>

            <div class="col-md-3">
                <img src="images/cooking.jpg" alt="cooking" class="top-image">
            </div>

        </div>

        </div>


    </body>
</html>
